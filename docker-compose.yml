version: '3.8'

services:
  # Main Backend API (CPU Only)
  web:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: python backend/app.py
    ports:
      - "5000:5000"
    volumes:
      - .:/app
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DATABASE_URL=sqlite:///exam_platform.db
    depends_on:
      - redis

  # AI Worker 1 (GPU Enabled)
  worker1:
    build:
      context: .
      dockerfile: Dockerfile.gpu
    command: celery -A backend.tasks worker --loglevel=info --pool=solo --hostname=worker1@%h
    volumes:
      - .:/app
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      - redis

  # Additional workers for scaling...
  worker2:
    build:
      context: .
      dockerfile: Dockerfile.gpu
    command: celery -A backend.tasks worker --loglevel=info --pool=solo --hostname=worker2@%h
    volumes:
      - .:/app
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - NVIDIA_VISIBLE_DEVICES=all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      - redis

  # Message Broker
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
