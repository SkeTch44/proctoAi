[project]
name = "proctoai-proctoring-svc"
version = "1.0.0"
description = "ProctoAI Proctoring & Cheat Detection Service (GPU)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-jose[cryptography]>=3.3.0",
    "redis>=5.0.0",
    "prometheus-client>=0.20.0",
    "httpx>=0.27.0",
    "numpy>=1.24.0",
    "opencv-python-headless>=4.8.0",
    "Pillow>=10.0.0",
    "ultralytics>=8.1.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
