[project]
name = "proctoai-question-svc"
version = "1.0.0"
description = "ProctoAI Question Generation & Bank Service"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "sqlalchemy>=2.0.30",
    "psycopg2-binary>=2.9.9",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.9",
    "redis>=5.0.0",
    "celery>=5.4.0",
    "prometheus-client>=0.20.0",
    "httpx>=0.27.0",
    # PDF extraction
    "pdfplumber>=0.11.0",
    "PyPDF2>=3.0.0",
    # LLM
    "requests>=2.31.0",
    # RAG
    "sentence-transformers>=2.2.0",
    "faiss-cpu>=1.7.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
